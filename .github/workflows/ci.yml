name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: figcit
          POSTGRES_PASSWORD: figcit
          POSTGRES_DB: figcit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U figcit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://figcit:figcit@127.0.0.1:5432/figcit
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Migrate database
        run: pnpm payload migrate
      - name: Integration tests
        run: pnpm test:int
      - name: Seed content
        run: pnpm seed
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
      - name: Lighthouse budgets (Home, Services, Contact)
        run: pnpm exec lhci autorun --config=./lighthouserc.cjs
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
