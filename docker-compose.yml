# Local Postgres for development. Production uses Neon (UK or EU region).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: figcit
      POSTGRES_PASSWORD: figcit
      POSTGRES_DB: figcit
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
